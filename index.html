<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A collection of assorted tools.">
  <title>Assorted Tools</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page-shell">
    <div class="utility-row">
      <div class="utility-links"></div>
      <div class="utility-actions">
        <a id="auth-link" class="utility-button" href="/login" aria-label="Log in">Log in</a>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false" aria-label="Switch to night mode" title="Switch to night mode">&#9728;</button>
      </div>
    </div>
    <header class="masthead">
      <h1>Assorted Tools</h1>
    </header>

    <section aria-labelledby="tools-title">
      <h2 id="tools-title">Tools</h2>
      <nav class="tool-list" aria-label="Available tools">
        <a href="lineup-coach/">
          <span>Lineup Coach</span>
          <span aria-hidden="true">&#8594;</span>
        </a>
        <a href="dm-screen/">
          <span>DM Screen</span>
          <span aria-hidden="true">&#8594;</span>
        </a>
      </nav>
    </section>
  </main>
  <script>
    const themeToggle = document.getElementById('theme-toggle');
    const savedTheme = localStorage.getItem('jp-domain-theme');
    const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.dataset.theme = savedTheme || (systemPrefersDark ? 'dark' : 'light');
    fetch('/api/data').then(response => response.ok ? response.json() : null).then(result => {
      if (!savedTheme && result?.data?.theme) document.documentElement.dataset.theme = result.data.theme;
      updateThemeToggle();
    }).catch(() => {});
    const updateThemeToggle = () => {
      const dark = document.documentElement.dataset.theme === 'dark';
      themeToggle.textContent = dark ? '☾' : '☀';
      themeToggle.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to night mode');
      themeToggle.title = dark ? 'Switch to light mode' : 'Switch to night mode';
      themeToggle.setAttribute('aria-pressed', String(dark));
    };
    const authLink = document.getElementById('auth-link');
    const syncAuthState = async () => {
      try {
        const response = await fetch('/api/auth/session', { credentials: 'same-origin' });
        const result = await response.json().catch(() => ({}));
        const authenticated = !!result?.authenticated;
        const username = authenticated ? (result.username || 'User') : '';

        authLink.textContent = authenticated ? `${username} • Log out` : 'Log in';
        authLink.setAttribute('aria-label', authenticated ? `Log out ${username}` : 'Log in');
        authLink.dataset.authenticated = String(authenticated);

        if (authenticated) {
          authLink.href = '#';
          authLink.onclick = async (event) => {
            event.preventDefault();
            await fetch('/api/auth/logout', { method: 'POST', credentials: 'same-origin' });
            window.location.reload();
          };
        } else {
          authLink.href = '/login';
          authLink.onclick = null;
        }
      } catch {
        authLink.textContent = 'Log in';
        authLink.href = '/login';
        authLink.dataset.authenticated = 'false';
      }
    };

    themeToggle.addEventListener('click', () => {
      const dark = document.documentElement.dataset.theme === 'dark';
      document.documentElement.dataset.theme = dark ? 'light' : 'dark';
      const theme = dark ? 'light' : 'dark';
      localStorage.setItem('jp-domain-theme', theme);
      fetch('/api/data', { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ theme }) }).catch(() => {});
      updateThemeToggle();
    });
    updateThemeToggle();
    syncAuthState();
  </script>
</body>
</html>
